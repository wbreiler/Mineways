name: Check candidate downloads
on:
  push:
    branches: [codex/package-validation]
    paths:
      - .github/workflows/validate-packaging.yml
      - Mac/tests/launcher_picker_gui.py
      - Mac/tests/launcher_picker.applescript
permissions:
  contents: read
  actions: read
jobs:
  mac-picker:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Check native desktop availability
        run: osascript Mac/tests/launcher_picker.applescript preflight 0
        timeout-minutes: 2
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v8
        with:
          name: package-macos-universal
          path: candidate
          github-token: ${{ github.token }}
          run-id: 43572298493
      - name: Extract the verified universal download
        run: |
          cd candidate
          echo 'dd41a37a44e0b917cf2fe75c1e5e549f05d001194eb65d45e1bb3a21bdf418cd  Mineways-macOS.zip' | shasum -a 256 -c -
          ditto -x -k Mineways-macOS.zip "fresh extraction"
          python -c 'import json; from pathlib import Path; assert json.loads(Path("fresh extraction/BUILD-METADATA.json").read_text())["source_revision"] == "3a1515c2b66d250aacf0bb2c6a6b58a6926f3819"'
      - name: Install both real pack fixtures
        run: python tools/test_launcher_real_packs.py "candidate/fresh extraction" --output launcher-packs
      - name: Select both packs using their native dialogs
        run: python Mac/tests/launcher_picker_gui.py "candidate/fresh extraction" --installations launcher-packs --output picker
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: mac-picker-evidence
          path: |
            picker/*.json
            picker/*.log
            picker/*.txt
            picker/*.png
            picker/*/map.png
            launcher-packs/validation.json
